interface:
  display_name: "Execute Pipeline"
  short_description: "Deliver one worktask end to end: ticket, branch, draft PR, implement, Ralph loop, ready, review fixes"
  default_prompt: "Run the ai-execute-pipeline skill for the given --worktask and --parent: run the preflight script, create the sub-ticket from the worktask (never the diff), create the branch and draft PR (as a gh stack layer when --initialize or --stack was given, or the current branch is a stack top), implement the worktask, commit, run the Ralph loop, commit and push, mark the PR ready, export Understandings when --understanding-export is set, then wait for the head-commit AI review and run ai-review --fix on Critical/High findings until clean. Treat every given switch as the user's decision and never ask to confirm it. Use only the skill's scripts for shell steps and report from their outputs."
