name: Skill Security Scan

# Gates AI agent skills in .agents/skills/ with NVIDIA SkillSpector.
# SkillSpector exit codes (src/skillspector/cli.py): risk_score > 50 -> 1 (HIGH/CRITICAL),
# error -> 2, otherwise 0. These are first-party skills that legitimately run shell/gh/git,
# so SkillSpector pins the raw score at 100 (exit 1) by design. The GATE therefore does NOT
# key off the raw exit code; skillspector-report.py applies .github/skillspector-baseline.yml
# (accepted findings, each justified) and the gate fails only on ACTIVE (non-baselined)
# findings. A scan error (exit 2) still hard-fails. New/unexpected findings still block.
# SkillSpector publishes no git tags and is not on PyPI, so we pin a commit SHA and
# emit a non-blocking warning when upstream main has moved past the pin.

on:
  pull_request:
    # Run on ready PRs only. Draft PRs still emit opened/synchronize, but the
    # job-level `if` below skips them; marking ready fires ready_for_review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/skillspector-report.py'
      - '.github/skillspector-baseline.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/skillspector-report.py'
      - '.github/skillspector-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code scanning

env:
  # Pinned SkillSpector commit. Bump after reviewing the warning from the
  # "Check for newer SkillSpector version" step below.
  SKILLSPECTOR_REF: a5092dd9b9521ff57a9b53612bb129ce78019002

jobs:
  skill-scan:
    name: SkillSpector
    runs-on: ubuntu-latest
    # Skip draft PRs; push and workflow_dispatch have no PR context so they always run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SkillSpector (pinned)
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NVIDIA/SkillSpector.git /tmp/skillspector
          git -C /tmp/skillspector checkout "$SKILLSPECTOR_REF"
          pip install -e /tmp/skillspector
          skillspector --version

      - name: Check for newer SkillSpector version (warning only)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/NVIDIA/SkillSpector/commits/main --jq .sha)
          if [ "$latest" != "$SKILLSPECTOR_REF" ]; then
            echo "::warning title=SkillSpector update available::Pinned $SKILLSPECTOR_REF but upstream main is $latest. Review changes and bump SKILLSPECTOR_REF in .github/workflows/skill-scan.yml."
            {
              echo "### ⚠️ SkillSpector update available"
              echo ""
              echo "- Pinned: \`$SKILLSPECTOR_REF\`"
              echo "- Upstream \`main\`: \`$latest\`"
              echo ""
              echo "Review upstream changes, then bump \`SKILLSPECTOR_REF\` in \`.github/workflows/skill-scan.yml\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ SkillSpector pin is current (\`$SKILLSPECTOR_REF\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Scan once with --format json (the richest output). The render step below
      # derives both the job summary and the SARIF from that single run, so the
      # LLM stage is not paid for twice. This step records the SkillSpector exit
      # code instead of failing, so the summary/upload steps always run; the gate
      # is enforced last by the "Enforce gate" step.
      - name: Scan skills
        id: scan
        env:
          # Provider config supplied via org/repo settings. The left-hand names are
          # the fixed env vars SkillSpector reads; the ${{ }} sources are namespaced
          # org variables/secrets. When the API key is absent the scan falls back to
          # fast static-only analysis (--no-llm), so the gate works with zero secrets.
          SKILLSPECTOR_PROVIDER: ${{ vars.SKILLSPECTOR_PROVIDER || 'openai' }}
          SKILLSPECTOR_MODEL: ${{ vars.SKILLSPECTOR_MODEL }}              # bare model id; empty = provider default
          OPENAI_BASE_URL: ${{ vars.SKILLSPECTOR_OPENAI_BASE_URL }}      # OpenAI-compatible base, must end at /v1
          OPENAI_API_KEY: ${{ secrets.SKILLSPECTOR_OPENAI_API_KEY }}
        run: |
          set -uo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "Running LLM semantic analysis (provider: $SKILLSPECTOR_PROVIDER, model: ${SKILLSPECTOR_MODEL:-provider default}, base: ${OPENAI_BASE_URL:-api.openai.com/v1})."
            llm_flag=""
          else
            echo "SKILLSPECTOR_OPENAI_API_KEY not set — running static-only (--no-llm)."
            llm_flag="--no-llm"
          fi
          set +e
          skillspector scan .agents/skills/ $llm_flag --format json --output skillspector.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Render report (job summary + SARIF + gate decision)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          python3 .github/scripts/skillspector-report.py \
            skillspector.json skillspector.sarif .agents/skills \
            --baseline .github/skillspector-baseline.yml \
            --decision-file skillspector-gate.txt \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && hashFiles('skillspector.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillspector.sarif
          category: skillspector

      - name: Enforce gate
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          code="${{ steps.scan.outputs.exit_code }}"
          decision="$(cat skillspector-gate.txt 2>/dev/null || echo missing)"
          # Scan error (exit 2) always hard-fails — an incomplete scan must not pass.
          if [ "$code" = "2" ]; then
            echo "::error title=SkillSpector scan error::SkillSpector exited 2 (scan error). See the scan step log."
            exit 1
          fi
          # Otherwise the baseline-aware decision is authoritative. Raw exit 1 (risk > 50)
          # is expected for first-party skills and is fine when decision=pass.
          if [ "$decision" != "pass" ]; then
            echo "::error title=SkillSpector gate failed::Active (non-baselined) findings present (decision=$decision). See the job summary; fix them or add a justified entry to .github/skillspector-baseline.yml."
            exit 1
          fi
          echo "✅ SkillSpector gate passed (raw exit $code; baseline-aware decision: pass)."
